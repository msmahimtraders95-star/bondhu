name: bondhu
description: "বন্ধু - একটি আধুনিক সামাজিক যোগাযোগের অ্যাপ।"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0

  # Google Sign-In
  google_sign_in: ^7.1.1

  # Image Picker
  image_picker: ^1.2.0

  # Google Mobile Ads
  google_mobile_ads: ^6.0.0

  # State management
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
