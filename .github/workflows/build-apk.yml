name: Build Bondhu APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Check Android V1 embedding
        run: |
          set +e

          echo "========================================"
          echo "SEARCHING FOR ANDROID V1 EMBEDDING"
          echo "========================================"

          echo ""
          echo "Searching for io.flutter.app..."
          grep -RIn --exclude-dir=.git "io.flutter.app" . || true

          echo ""
          echo "Searching for GeneratedPluginRegistrant..."
          grep -RIn --exclude-dir=.git "GeneratedPluginRegistrant" . || true

          echo ""
          echo "Searching for PluginRegistry.Registrar..."
          grep -RIn --exclude-dir=.git "PluginRegistry.Registrar" . || true

          echo ""
          echo "Searching for registerWith..."
          grep -RIn --exclude-dir=.git "registerWith" . || true

          echo ""
          echo "Searching for old FlutterActivity..."
          grep -RIn --exclude-dir=.git "FlutterActivity" android || true

          echo ""
          echo "========================================"
          echo "ANDROID DIRECTORY"
          echo "========================================"

          find android -type f | sort

          echo ""
          echo "========================================"
          echo "V1 SEARCH COMPLETED"
          echo "========================================"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bondhu-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
