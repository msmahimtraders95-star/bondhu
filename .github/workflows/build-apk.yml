name: Build Bondhu APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Show project structure
        run: |
          echo "========================================"
          echo "PROJECT STRUCTURE"
          echo "========================================"

          pwd

          echo ""
          echo "Root files:"
          find . -maxdepth 2 -type f | sort

          echo ""
          echo "Android files:"
          if [ -d android ]; then
            find android -type f | sort
          else
            echo "ANDROID DIRECTORY DOES NOT EXIST"
          fi

      - name: Check old Flutter V1 embedding
        run: |
          echo "========================================"
          echo "CHECKING FLUTTER V1 EMBEDDING"
          echo "========================================"

          echo ""
          echo "--- io.flutter.app ---"
          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=build \
            "io.flutter.app" . || true

          echo ""
          echo "--- GeneratedPluginRegistrant ---"
          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=build \
            "GeneratedPluginRegistrant" . || true

          echo ""
          echo "--- PluginRegistry.Registrar ---"
          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=build \
            "PluginRegistry.Registrar" . || true

          echo ""
          echo "--- registerWith ---"
          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=build \
            "registerWith" . || true

          echo ""
          echo "--- FlutterActivity ---"
          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=build \
            "FlutterActivity" android lib 2>/dev/null || true

      - name: Check Android project
        run: |
          echo "========================================"
          echo "CHECKING ANDROID PROJECT"
          echo "========================================"

          if [ -f android/settings.gradle ]; then
            echo "OK: android/settings.gradle"
          else
            echo "MISSING: android/settings.gradle"
          fi

          if [ -f android/build.gradle ]; then
            echo "OK: android/build.gradle"
          else
            echo "MISSING: android/build.gradle"
          fi

          if [ -f android/gradle.properties ]; then
            echo "OK: android/gradle.properties"
          else
            echo "MISSING: android/gradle.properties"
          fi

          if [ -f android/app/build.gradle ]; then
            echo "OK: android/app/build.gradle"
          else
            echo "MISSING: android/app/build.gradle"
          fi

          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            echo "OK: AndroidManifest.xml"
          else
            echo "MISSING: AndroidManifest.xml"
          fi

      - name: Get dependencies
        run: |
          flutter pub get

      - name: Flutter analyze
        run: |
          flutter analyze

      - name: Flutter clean
        run: |
          flutter clean

      - name: Get dependencies after clean
        run: |
          flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release

      - name: Check generated APK
        run: |
          echo "========================================"
          echo "CHECKING APK"
          echo "========================================"

          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "APK CREATED SUCCESSFULLY"
            ls -lh build/app/outputs/flutter-apk/app-release.apk
          else
            echo "APK WAS NOT CREATED"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bondhu-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
