name: Build Bondhu APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Search for Android V1 embedding
        run: |
          set +e

          echo "========================================"
          echo "SEARCHING FOR ANDROID V1 EMBEDDING"
          echo "========================================"

          echo ""
          echo "Searching FlutterActivity..."
          grep -Rni --exclude-dir=.git \
            "io.flutter.app.FlutterActivity" . || true

          echo ""
          echo "Searching FlutterApplication..."
          grep -Rni --exclude-dir=.git \
            "io.flutter.app.FlutterApplication" . || true

          echo ""
          echo "Searching PluginRegistry.Registrar..."
          grep -Rni --exclude-dir=.git \
            "PluginRegistry.Registrar" . || true

          echo ""
          echo "Searching flutterEmbedding..."
          grep -Rni --exclude-dir=.git \
            "flutterEmbedding" . || true

          echo ""
          echo "Searching old Flutter embedding packages..."
          grep -Rni --exclude-dir=.git \
            "io.flutter.embedding" android || true

          echo ""
          echo "Android Java/Kotlin files:"
          find android -type f \( -name "*.java" -o -name "*.kt" \) -print || true

          echo ""
          echo "========================================"
          echo "V1 SEARCH COMPLETED"
          echo "========================================"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bondhu-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
