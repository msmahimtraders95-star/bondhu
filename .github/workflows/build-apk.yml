name: Build Bondhu APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          set -e
          flutter --version
          java -version

      - name: Regenerate modern Android project
        run: |
          set -e

          echo "========================================"
          echo "CREATING MODERN ANDROID PROJECT"
          echo "========================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.bondhu \
            --project-name bondhu \
            .

      - name: Remove default Flutter test
        run: |
          set -e

          rm -f test/widget_test.dart

      - name: Configure Android application
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING ANDROID APPLICATION"
          echo "========================================"

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'dev.flutter.flutter-gradle-plugin'
          }

          android {
              namespace = 'com.bondhu.app'

              compileSdk = flutter.compileSdkVersion

              defaultConfig {
                  applicationId = 'com.bondhu.app'

                  minSdk = 23
                  targetSdk = flutter.targetSdkVersion

                  versionCode = 1
                  versionName = '1.0.1'
              }

              signingConfigs {
                  release {
                      storeFile file("${rootProject.projectDir}/bondhu-release-key.jks")
                      storePassword "BondhuRelease2026"
                      keyAlias "bondhu"
                      keyPassword "BondhuRelease2026"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release

                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source = '../..'
          }
          EOF

      - name: Create release signing key
        run: |
          set -e

          echo "========================================"
          echo "CREATING RELEASE SIGNING KEY"
          echo "========================================"

          keytool -genkeypair \
            -v \
            -keystore android/bondhu-release-key.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias bondhu \
            -storepass BondhuRelease2026 \
            -keypass BondhuRelease2026 \
            -dname "CN=Bondhu, OU=Bondhu, O=Bondhu, L=Dhaka, ST=Dhaka, C=BD"

          echo "Release key created successfully."

      - name: Verify Android configuration
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID CONFIGURATION"
          echo "========================================"

          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/bondhu/app/MainActivity.kt
          test -f android/bondhu-release-key.jks

          grep -q "com.bondhu.app" android/app/build.gradle
          grep -q "minSdk = 23" android/app/build.gradle
          grep -q "versionName = '1.0.1'" android/app/build.gradle

          echo "Android configuration verified."

      - name: Get dependencies
        run: |
          set -e

          echo "========================================"
          echo "GETTING FLUTTER DEPENDENCIES"
          echo "========================================"

          flutter pub get

      - name: Analyze Flutter project
        run: |
          set -e

          echo "========================================"
          echo "RUNNING FLUTTER ANALYZE"
          echo "========================================"

          flutter analyze

      - name: Build release APK
        run: |
          set -e

          echo "========================================"
          echo "BUILDING RELEASE APK"
          echo "========================================"

          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --target-platform android-arm,android-arm64

      - name: Verify APK exists
        run: |
          set -e

          echo "========================================"
          echo "CHECKING APK"
          echo "========================================"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          ls -lh "$APK"

          echo "APK found successfully."

      - name: Verify APK alignment
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK ALIGNMENT"
          echo "========================================"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" \
            -name zipalign \
            -type f | sort -V | tail -n 1)

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          "$ZIPALIGN" -c -v 4 "$APK"

          echo "APK alignment verified."

      - name: Verify APK signature
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK SIGNATURE"
          echo "========================================"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            -type f | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo "APK signature verified."

      - name: Show APK information
        run: |
          set -e

          echo "========================================"
          echo "APK INFORMATION"
          echo "========================================"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          ls -lh "$APK"

          echo ""
          echo "SHA-256:"
          sha256sum "$APK"

          echo ""
          echo "APK verification completed successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bondhu-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: errorerror
