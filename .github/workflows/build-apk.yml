name: Build Bondhu APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: |
          flutter --version

      - name: Check project structure
        run: |
          set +e

          echo "========================================"
          echo "CHECKING BONDHU PROJECT"
          echo "========================================"

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "Android files:"
          find android -type f | sort

          echo ""
          echo "========================================"
          echo "CHECKING OLD FLUTTER V1 EMBEDDING"
          echo "========================================"

          echo ""
          echo "--- io.flutter.app ---"
          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=build \
            "io.flutter.app" . || true

          echo ""
          echo "--- GeneratedPluginRegistrant ---"
          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=build \
            "GeneratedPluginRegistrant" . || true

          echo ""
          echo "--- PluginRegistry.Registrar ---"
          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=build \
            "PluginRegistry.Registrar" . || true

          echo ""
          echo "--- registerWith ---"
          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=build \
            "registerWith" . || true

          echo ""
          echo "--- old FlutterActivity ---"
          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=build \
            "io.flutter.app.FlutterActivity" . || true

          echo ""
          echo "--- old FlutterApplication ---"
          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=build \
            "io.flutter.app.FlutterApplication" . || true

          echo ""
          echo "========================================"
          echo "CHECK COMPLETE"
          echo "========================================"

      - name: Verify Android configuration
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID CONFIGURATION"
          echo "========================================"

          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/gradle.properties
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml

          echo "All required Android files exist."

      - name: Get Flutter dependencies
        run: |
          flutter pub get

      - name: Flutter analyze
        run: |
          flutter analyze

      - name: Flutter clean
        run: |
          flutter clean

      - name: Get dependencies again
        run: |
          flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release

      - name: Verify APK
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK"
          echo "========================================"

          test -f build/app/outputs/flutter-apk/app-release.apk

          ls -lh build/app/outputs/flutter-apk/app-release.apk

          echo "APK build completed successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bondhu-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
