name: Setup Bondhu Flutter Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Android project
        run: |
          flutter create \
            --project-name bondhu \
            --org com.bondhu \
            .

      - name: Restore Firebase configuration
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "Firebase configuration found."
          else
            echo "Firebase configuration not found."
          fi

      - name: Commit Flutter project
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Create Flutter Android project" || echo "No changes"
          git push
